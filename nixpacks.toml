# Railway Nixpacks Configuration
# Forces modern LTS Node.js 20 package (Node 18 is EOL and removed in upstream nixpkgs)

[phases.setup]
nixPkgs = ["nodejs_20"]

[phases.install]
cmds = ["npm ci --include=dev || npm install --include=dev"]

[phases.build]
cmds = ["npm run build"]

[variables]
NODE_ENV = "production"

[start]
cmd = "node dist/server.cjs"

