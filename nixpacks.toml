# Railway Nixpacks Configuration
# Modern LTS Node.js 22 (Active LTS required by modern Firebase Admin SDK 14+)

[phases.setup]
nixPkgs = ["nodejs_22"]

[phases.install]
cmds = ["npm ci --include=dev || npm install --include=dev"]

[phases.build]
cmds = ["npm run build"]

[variables]
NODE_ENV = "production"

[start]
cmd = "node dist/server.cjs"

